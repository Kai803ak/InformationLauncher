plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.hw.dpf.information'
    compileSdk 34

    defaultConfig {
        applicationId "com.hw.dpf.information"
        minSdk 1
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation libs.junit
}
